apply plugin: 'com.android.application'

def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def webClientId = localProps.getProperty("GOOGLE_WEB_CLIENT_ID", "")
def debugTarget = localProps.getProperty("CAPACITOR_DEBUG_TARGET", "local")
def protectionHeader = "preview".equals(debugTarget) ? localProps.getProperty("VERCEL_PROTECTION_HEADER", "") : ""
def signingProps = new Properties()
def signingPath = localProps.getProperty("RELEASE_SIGNING_FILE", "")
def signingReady = false
if (signingPath) {
    def signingFile = new File(signingPath)
    if (signingFile.isFile()) {
        signingFile.withInputStream { signingProps.load(it) }
        signingReady = ["storeFile", "storePassword", "keyAlias", "keyPassword"].every { signingProps.getProperty(it) }
    }
}

android {
    namespace = "fr.javachrist.souspli"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.javachrist.souspli"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue "string", "google_web_client_id", webClientId
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(signingProps.getProperty("storeFile"))
                storePassword signingProps.getProperty("storePassword")
                keyAlias signingProps.getProperty("keyAlias")
                keyPassword signingProps.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        debug {
            resValue "string", "vercel_protection_header", protectionHeader
        }
        release {
            minifyEnabled false
            debuggable false
            resValue "string", "vercel_protection_header", ""
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.any { it.name == "bundleRelease" || it.name == "assembleRelease" }
    if (releaseTask && !signingReady) {
        throw new GradleException("La signature release est absente. Aucun paquet signé n'est produit.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "com.android.billingclient:billing:8.3.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
